name: Atualizar dashboard (a cada 2 horas)

# O plano gratuito da Vercel só permite cron diário, então o agendador fica
# aqui. O efeito é o mesmo: uma chamada ao endpoint protegido de refresh.
on:
  schedule:
    - cron: '5 */2 * * *'   # 5 minutos após cada hora par, em UTC
  workflow_dispatch:         # permite disparar manualmente pela aba Actions

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o endpoint de atualização
        run: |
          echo "Disparando atualização..."
          codigo=$(curl -sS -o /tmp/resposta.json -w "%{http_code}" \
            --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.DASHBOARD_URL }}/api/cron/refresh")
          echo "HTTP $codigo"
          cat /tmp/resposta.json
          # 207 significa que parte das fontes falhou, mas o ciclo rodou.
          if [ "$codigo" != "200" ] && [ "$codigo" != "207" ]; then
            exit 1
          fi
